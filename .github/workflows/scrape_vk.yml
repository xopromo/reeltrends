name: Scrape VK

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'  # 4 раза в день
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: worker (обычный) или scout (разведка)'
        required: false
        default: 'worker'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx

      - name: Run VK scraper
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_MODE: ${{ inputs.mode || 'worker' }}
        run: python vk_scraper.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vk.json vk_groups.json
          git diff --staged --quiet || git commit -m "vk $(date -u +'%H:%M UTC')"
          git push
