name: Scrape VK

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'worker или scout'
        required: false
        default: 'worker'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run VK scraper
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_MODE: ${{ inputs.mode || 'worker' }}
        run: python vk_scraper.py
      - name: Update version
        run: |
          echo "{\"deployed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${GITHUB_SHA::7}\"}" > version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f vk.json vk_groups.json version.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "vk $(date -u +'%H:%M UTC')"
          git push
