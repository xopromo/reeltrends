name: Scrape YouTube

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'  # 4 раза в день: 01:00, 07:00, 13:00, 19:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run YouTube scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_scraper.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.json yt_channels.json
          git diff --staged --quiet || git commit -m "youtube $(date -u +'%H:%M UTC')"
          git push
