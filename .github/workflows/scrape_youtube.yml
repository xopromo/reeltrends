name: Scrape YouTube

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      night_run:
        description: 'Ночной режим'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run YouTube scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_NIGHT_RUN: ${{ (github.event.schedule == '30 23 * * *' || inputs.night_run == 'true') && 'true' || 'false' }}
        run: python youtube_scraper.py
      - name: Update version
        run: |
          echo "{\"deployed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${GITHUB_SHA::7}\"}" > version.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.json yt_channels.json version.json
          git diff --staged --quiet || git commit -m "youtube $(date -u +'%H:%M UTC')"
          git push
