name: Scrape YouTube

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'   # обычные запуски 4 раза в день
    - cron: '30 23 * * *'          # ночной дообор — используем остаток квоты
  workflow_dispatch:
    inputs:
      night_run:
        description: 'Ночной режим (расширенный сбор)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx

      - name: Run YouTube scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_MAX_CHANNELS: ${{ secrets.YT_MAX_CHANNELS }}
          # Ночной режим — если запущен в 23:30 или вручную с флагом
          YT_NIGHT_RUN: ${{ (github.event.schedule == '30 23 * * *' || inputs.night_run == 'true') && 'true' || 'false' }}
        run: python youtube_scraper.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.json yt_channels.json
          git diff --staged --quiet || git commit -m "youtube $(date -u +'%H:%M UTC')${{ (github.event.schedule == '30 23 * * *') && ' [night]' || '' }}"
          git push
