name: Scrape Trends

on:
  schedule:
    - cron: '*/30 * * * *'  # каждые 30 минут
  workflow_dispatch:          # кнопка ручного запуска в интерфейсе GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # чтобы коммитить trends.json обратно в репо

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run scraper
        run: python scraper.py

      - name: Commit trends.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --staged --quiet || git commit -m "update trends $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
