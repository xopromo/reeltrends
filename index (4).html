<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelTrends — рентген для рилсов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0c0c0c;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --cream: #e8e4d9;
    --cream-dim: #9e9a8e;
    --cream-muted: #5a564e;
    --green: #4ade80;
    --amber: #fbbf24;
    --orange: #fb923c;
    --red: #f87171;
    --cyan: #22d3ee;
    --blue: #60a5fa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,12,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'DM Serif Display', serif;
    font-size: 18px; color: var(--cream);
    text-decoration: none;
  }

  .logo-icon {
    width: 28px; height: 28px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .status-pill {
    display: flex; align-items: center; gap-6px;
    font-size: 11px; color: var(--cream-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* MAIN */
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  .page-header { margin-bottom: 28px; }
  .page-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; font-weight: 400;
    color: var(--cream); margin-bottom: 6px;
  }
  .page-subtitle { font-size: 13px; color: var(--cream-dim); }

  /* FILTERS */
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 24px;
  }

  .filter-group {
    display: flex; align-items: center; gap: 1px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 3px;
  }

  .filter-btn {
    padding: 6px 12px;
    border: none; background: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--cream-dim);
    border-radius: 7px;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { color: var(--cream); }
  .filter-btn.active {
    background: var(--surface2);
    color: var(--cream);
  }
  .filter-btn.active-cyan { background: rgba(34,211,238,0.12); color: var(--cyan); }

  .search-wrap {
    position: relative; flex: 1; min-width: 180px;
  }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--cream-muted); pointer-events: none;
  }
  .search-input {
    width: 100%; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px 0 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--cream);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--cream-muted); }
  .search-input:focus { border-color: var(--border2); }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex; flex-direction: column;
  }

  .card:hover {
    transform: scale(1.02);
    border-color: var(--border2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .card-thumb {
    position: relative;
    aspect-ratio: 3/4;
    background: var(--surface2);
    overflow: hidden;
  }

  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.3s;
  }
  .card:hover .card-thumb img { transform: scale(1.05); }

  .thumb-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--cream-muted); font-size: 11px;
  }

  /* Gradient overlays */
  .card-thumb::before {
    content: '';
    position: absolute; inset-x: 0; top: 0; height: 64px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    z-index: 1; pointer-events: none;
  }
  .card-thumb::after {
    content: '';
    position: absolute; inset-x: 0; bottom: 0; height: 80px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    z-index: 1; pointer-events: none;
  }

  /* Badges */
  .badges {
    position: absolute; top: 8px; left: 8px;
    display: flex; align-items: center; gap: 6px; z-index: 2;
  }

  .platform-icon { width: 22px; height: 22px; }

  .badge-rank {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(232,228,217,0.9);
    color: #0c0c0c; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .badge-new {
    padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .badge-viral {
    background: rgba(251,146,60,0.25); color: var(--orange);
    border: 1px solid rgba(251,146,60,0.4);
  }
  .badge-today {
    background: rgba(34,211,238,0.2); color: var(--cyan);
    border: 1px solid rgba(34,211,238,0.35);
    display: flex; align-items: center; gap: 3px;
  }

  /* Bottom overlay on thumb */
  .card-thumb-bottom {
    position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 2;
  }

  .card-views {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #fff;
  }

  .card-velocity {
    font-size: 10px; color: var(--green); font-weight: 500;
  }

  .card-age { font-size: 10px; color: rgba(255,255,255,0.55); }

  /* Card body */
  .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 5px; }

  .card-author {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }

  .card-username {
    font-size: 12px; font-weight: 500; color: var(--cream);
    truncate; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    flex: 1;
  }

  .card-niche {
    font-size: 10px; color: var(--cream-muted);
    background: var(--surface2); padding: 2px 6px; border-radius: 20px;
    white-space: nowrap;
  }

  .card-stats {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; color: var(--cream-dim);
  }

  .xfactor-badge {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .xf-gray  { background: rgba(82,82,91,0.5); color: #a1a1aa; }
  .xf-amber { background: rgba(251,191,36,0.2); color: var(--amber); border: 1px solid rgba(251,191,36,0.3); }
  .xf-orange{ background: rgba(251,146,60,0.2); color: var(--orange); border: 1px solid rgba(251,146,60,0.3); }
  .xf-red   { background: rgba(248,113,113,0.2); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }

  .cr-value { font-family: 'JetBrains Mono', monospace; }
  .cr-high  { color: var(--orange); }
  .cr-med   { color: var(--green); }
  .cr-low   { color: var(--cream-dim); }

  /* PAGINATION */
  .pagination {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 32px;
  }
  .page-btn {
    padding: 8px 20px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--cream-dim);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  .page-btn:hover:not(:disabled) { color: var(--cream); border-color: var(--border2); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 13px; color: var(--cream-dim); font-variant-numeric: tabular-nums; }

  /* LOADING */
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .skel-thumb { aspect-ratio: 3/4; background: var(--surface2); animation: shimmer 1.5s infinite; }
  .skel-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .skel-line { height: 10px; background: var(--surface2); border-radius: 4px; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* EMPTY */
  .empty { text-align: center; padding: 80px 0; color: var(--cream-dim); font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px; overflow: hidden;
    max-width: 480px; width: 100%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .modal-header {
    padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 18px; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: none; border: none; cursor: pointer;
    color: var(--cream-dim); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s;
  }
  .modal-close:hover { color: var(--cream); }
  .modal-body { padding: 16px 20px 20px; }
  .modal-thumb {
    width: 100%; border-radius: 12px; object-fit: cover;
    max-height: 300px; margin-bottom: 14px;
    background: var(--surface2);
  }
  .modal-caption {
    font-size: 13px; color: var(--cream-dim); line-height: 1.6;
    max-height: 120px; overflow-y: auto; margin-bottom: 14px;
  }
  .modal-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--surface2); border-radius: 10px; padding: 10px;
    text-align: center;
  }
  .stat-value { font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .stat-label { font-size: 10px; color: var(--cream-dim); margin-top: 2px; }
  .modal-link {
    display: block; width: 100%;
    padding: 10px; border-radius: 10px;
    background: rgba(232,228,217,0.1);
    border: 1px solid var(--border2);
    color: var(--cream); font-size: 13px; text-align: center;
    text-decoration: none; transition: background 0.15s;
  }
  .modal-link:hover { background: rgba(232,228,217,0.15); }

  /* Responsive */
  @media (max-width: 640px) {
    main { padding: 20px 16px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .filters { gap: 6px; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">🏴</div>
    ReelTrends
  </a>
  <div class="status-pill">
    <div class="status-dot"></div>
    <span id="status-text">загрузка...</span>
  </div>
</header>

<main>
  <div class="page-header">
    <h1 class="page-title">Тренды</h1>
    <p class="page-subtitle">Рилсы которые набирают аномально много прямо сейчас</p>
  </div>

  <!-- Filters -->
  <div class="filters">
    <!-- Sort -->
    <div class="filter-group" id="sort-group">
      <button class="filter-btn active" data-sort="hot_score">Горячее</button>
      <button class="filter-btn" data-sort="x_factor">X-factor</button>
      <button class="filter-btn" data-sort="views">Просмотры</button>
      <button class="filter-btn" data-sort="recent">Свежие</button>
    </div>

    <!-- Platform -->
    <div class="filter-group" id="platform-group">
      <button class="filter-btn active" data-platform="">Все</button>
      <button class="filter-btn" data-platform="instagram">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
      </button>
      <button class="filter-btn" data-platform="youtube">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px">
          <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </button>
      <button class="filter-btn" data-platform="tiktok">TikTok</button>
    </div>

    <!-- Days -->
    <div class="filter-group" id="days-group">
      <button class="filter-btn active" data-days="">Всё время</button>
      <button class="filter-btn active-cyan-ready" data-days="1">Сегодня</button>
      <button class="filter-btn" data-days="7">Неделя</button>
      <button class="filter-btn" data-days="30">Месяц</button>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="text" placeholder="Поиск по авторам, тексту..." id="search-input">
    </div>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>

  <!-- Pagination -->
  <div class="pagination">
    <button class="page-btn" id="prev-btn" disabled>← Назад</button>
    <span class="page-info" id="page-info">1 / 1</span>
    <button class="page-btn" id="next-btn" disabled>Вперёд →</button>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-author"></span>
      <button class="modal-close" onclick="document.getElementById('modal').style.display='none'">×</button>
    </div>
    <div class="modal-body">
      <img class="modal-thumb" id="modal-thumb" src="" alt="">
      <div class="modal-stats">
        <div class="stat-card">
          <div class="stat-value" id="modal-views">—</div>
          <div class="stat-label">просмотры</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="modal-xfactor" style="color:var(--amber)">—</div>
          <div class="stat-label">X-factor</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="modal-velocity" style="color:var(--green)">—</div>
          <div class="stat-label">просм/час</div>
        </div>
      </div>
      <div class="modal-caption" id="modal-caption"></div>
      <a class="modal-link" id="modal-link" href="#" target="_blank">Открыть рилс →</a>
    </div>
  </div>
</div>

<script>
const state = {
  sort: 'hot_score', platform: '', days: '', q: '',
  page: 1, total: 0, perPage: 20, loading: false
};

// Format numbers
function fmt(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

function timeAgo(iso) {
  if (!iso) return '';
  const h = Math.floor((Date.now() - new Date(iso)) / 3600000);
  if (h < 24) return `${h}ч назад`;
  return `${Math.floor(h/24)}д назад`;
}

function xfClass(v) {
  if (v == null) return 'xf-gray';
  if (v >= 10) return 'xf-red';
  if (v >= 5)  return 'xf-orange';
  if (v >= 2)  return 'xf-amber';
  return 'xf-gray';
}

function crClass(cr) {
  if (cr >= 2) return 'cr-high';
  if (cr >= 0.5) return 'cr-med';
  return 'cr-low';
}

function isNewViral(item) {
  if (!item.published_at || item.x_factor == null) return false;
  return (Date.now() - new Date(item.published_at)) / 3600000 < 48 && item.x_factor >= 5;
}

function isTodaysCatch(item) {
  if (!item.trending_since) return false;
  return (Date.now() - new Date(item.trending_since)) / 3600000 < 24;
}

function platformIcon(platform) {
  if (!platform) return '';
  const p = platform.toLowerCase();
  if (p === 'instagram') return `<svg class="platform-icon" viewBox="0 0 24 24" fill="none">
    <defs><radialGradient id="ig2" cx="30%" cy="107%" r="150%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="45%" stop-color="#fd5949"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </radialGradient></defs>
    <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig2)"/>
    <circle cx="12" cy="12" r="4.5" stroke="white" stroke-width="1.8" fill="none"/>
    <circle cx="17.2" cy="6.8" r="1.2" fill="white"/>
  </svg>`;
  if (p === 'youtube') return `<svg class="platform-icon" viewBox="0 0 24 24" fill="none">
    <rect x="1" y="4" width="22" height="16" rx="4" fill="#FF0000"/>
    <path d="M10 8.5v7l6-3.5-6-3.5z" fill="white"/>
  </svg>`;
  if (p === 'tiktok') return `<svg class="platform-icon" viewBox="0 0 24 24" fill="none">
    <rect x="2" y="2" width="20" height="20" rx="6" fill="black"/>
    <path d="M16.5 8.5c-1.1-.8-1.8-2-1.9-3.5h-2.1v10.5a2.5 2.5 0 1 1-1.7-2.4V11a4.5 4.5 0 1 0 3.7 4.5V10c.8.6 1.8 1 2.9 1V8.9c-.3 0-.6 0-.9-.1z" fill="white"/>
  </svg>`;
  return '';
}

function renderCard(item, rank) {
  const cr = item.views > 1000 && item.comments > 0
    ? (item.comments / item.views * 100) : null;
  const viral = isNewViral(item);
  const today = isTodaysCatch(item);

  const badges = [];
  badges.push(platformIcon(item.author?.platform));
  if (rank <= 3) {
    badges.push(`<div class="badge-rank">${rank}</div>`);
  } else if (today) {
    badges.push(`<span class="badge-new badge-today">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      сегодня
    </span>`);
  } else if (viral) {
    badges.push(`<span class="badge-new badge-viral">вирус</span>`);
  }

  const thumb = item.thumbnail_url
    ? `<img src="${item.thumbnail_url}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=thumb-placeholder>нет фото</div>'">`
    : `<div class="thumb-placeholder">нет фото</div>`;

  return `
  <div class="card" onclick="openModal(${JSON.stringify(item).replace(/"/g,'&quot;')})">
    <div class="card-thumb">
      ${thumb}
      <div class="badges">${badges.join('')}</div>
      <div class="card-thumb-bottom">
        <div class="card-views">
          ${item.views ? fmt(item.views) : ''}
          ${item.velocity ? `<span class="card-velocity">+${fmt(Math.round(item.velocity))}/ч</span>` : ''}
          ${item.published_at ? `<span class="card-age">${timeAgo(item.published_at)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-author">
        <span class="card-username">@${item.author?.username || '—'}</span>
        ${item.niche ? `<span class="card-niche">${item.niche}</span>` : ''}
      </div>
      <div class="card-stats">
        ${cr !== null ? `<span class="cr-value ${crClass(cr)}">${cr.toFixed(1)}% CR</span>` : ''}
        <span style="margin-left:auto">
          ${item.x_factor != null ? `<span class="xfactor-badge ${xfClass(item.x_factor)}">${item.x_factor.toFixed(1)}x</span>` : ''}
        </span>
      </div>
    </div>
  </div>`;
}

function renderSkeletons() {
  return Array.from({length: 8}).map(() => `
    <div class="skeleton">
      <div class="skel-thumb"></div>
      <div class="skel-body">
        <div class="skel-line" style="width:70%"></div>
        <div class="skel-line" style="width:45%"></div>
      </div>
    </div>`).join('');
}

async function loadTrends() {
  if (state.loading) return;
  state.loading = true;

  const grid = document.getElementById('grid');
  grid.innerHTML = renderSkeletons();

  const params = new URLSearchParams({
    sort: state.sort,
    platform: state.platform,
    page: state.page,
    per_page: state.perPage,
  });
  if (state.days) params.set('days', state.days);
  if (state.q) params.set('q', state.q);

  try {
    const res = await fetch(`/api/trends?${params}`);
    const data = await res.json();

    state.total = data.total;
    const totalPages = Math.ceil(data.total / state.perPage);

    if (!data.items.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>`;
    } else {
      const offset = (state.page - 1) * state.perPage;
      grid.innerHTML = data.items.map((item, i) => renderCard(item, offset + i + 1)).join('');
    }

    document.getElementById('page-info').textContent = `${state.page} / ${totalPages || 1}`;
    document.getElementById('prev-btn').disabled = state.page <= 1;
    document.getElementById('next-btn').disabled = state.page >= totalPages;

  } catch(e) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Ошибка загрузки: ${e.message}</div>`;
  }

  state.loading = false;
}

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const el = document.getElementById('status-text');
    if (data.total_reels) {
      el.textContent = `${data.total_reels} рилсов`;
    }
  } catch {}
}

// Filter clicks
document.getElementById('sort-group').addEventListener('click', e => {
  const btn = e.target.closest('[data-sort]');
  if (!btn) return;
  document.querySelectorAll('#sort-group .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.sort = btn.dataset.sort;
  state.page = 1;
  loadTrends();
});

document.getElementById('platform-group').addEventListener('click', e => {
  const btn = e.target.closest('[data-platform]');
  if (!btn) return;
  document.querySelectorAll('#platform-group .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.platform = btn.dataset.platform;
  state.page = 1;
  loadTrends();
});

document.getElementById('days-group').addEventListener('click', e => {
  const btn = e.target.closest('[data-days]');
  if (!btn) return;
  document.querySelectorAll('#days-group .filter-btn').forEach(b => {
    b.classList.remove('active');
    b.classList.remove('active-cyan');
  });
  btn.classList.add(btn.dataset.days === '1' ? 'active-cyan' : 'active');
  state.days = btn.dataset.days;
  state.page = 1;
  loadTrends();
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = e.target.value;
    state.page = 1;
    loadTrends();
  }, 400);
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (state.page > 1) { state.page--; loadTrends(); window.scrollTo(0,0); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  state.page++;
  loadTrends();
  window.scrollTo(0,0);
});

// Modal
function openModal(item) {
  document.getElementById('modal-author').textContent = '@' + (item.author?.username || '—');
  document.getElementById('modal-thumb').src = item.thumbnail_url || '';
  document.getElementById('modal-views').textContent = fmt(item.views);
  document.getElementById('modal-xfactor').textContent = item.x_factor ? item.x_factor.toFixed(1)+'x' : '—';
  document.getElementById('modal-velocity').textContent = item.velocity ? '+'+fmt(Math.round(item.velocity))+'/ч' : '—';
  document.getElementById('modal-caption').textContent = item.caption || 'Нет подписи';
  document.getElementById('modal-link').href = item.url;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').style.display = 'none';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal').style.display = 'none';
});

// Init
loadTrends();
loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
